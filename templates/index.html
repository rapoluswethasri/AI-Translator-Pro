<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator Pro</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <button class="theme-btn" onclick="toggleTheme()">
            🌙 Toggle Theme
        </button>

        <h1>🌍 AI Translator Pro</h1>

        <p>
            Break language barriers with AI-powered translation
        </p>

        <textarea id="text" placeholder="Enter text..."></textarea>

        <!-- 🎤 Voice Input -->
        <button class="voice-btn" onclick="startVoice()">
    🎤 Speak
</button>


        <div class="controls">

            <select id="dest">
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="ml">Malayalam</option>
                <option value="kn">Kannada</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>

            <button onclick="translateText()">
                Translate
            </button>

        </div>

        <div class="output-box">

            <h3>Translated Text</h3>

            <div id="output"></div>

            <!-- 🔊 Speak Translation -->
            <button onclick="speakText()">
    🔊 Speak Translation
</button>
        </div>

        <div class="history">

            <h3>🕘 Translation History</h3>

            <ul id="history"></ul>

        </div>

    </div>

<script>

async function translateText() {

    let text = document.getElementById("text").value;

    let dest = document.getElementById("dest").value;

    let res = await fetch("/translate", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            text,
            dest
        })

    });

    let data = await res.json();

    document.getElementById("output").innerText =
        data.translated_text;

    let li = document.createElement("li");

    li.innerText =
        text + " ➝ " + data.translated_text;

    document.getElementById("history")
        .appendChild(li);
}


/* 🎤 Voice Input */

function startVoice() {

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.onresult = function(event) {

        document.getElementById("text").value =
            event.results[0][0].transcript;

    };

    recognition.start();
}


/* 🔊 Speak Translation */

function speakText() {

    let text =
        document.getElementById("output").innerText;

    let speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "te-IN";

    window.speechSynthesis.speak(speech);
}


/* 🌙 Dark Mode */

function toggleTheme() {

    document.body.classList.toggle("dark");

}

</script>

</body>
</html>
